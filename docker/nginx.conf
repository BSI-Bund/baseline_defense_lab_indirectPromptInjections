#
# nginx site config for the standalone Angular frontend container.
#
# * Static SPA served from /usr/share/nginx/html with a History-API
#   (try_files ... /index.html) fallback so client-side deep links resolve.
# * /api/* is reverse-proxied to the FastAPI backend service. The upstream
#   hostname ``backend`` matches the docker-compose service name, so this
#   works inside the compose network with no further plumbing.

upstream bdl_backend {
    server backend:8000;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;

    # PDF uploads travel as base64 JSON through /api/extract; the nginx
    # default of 1m caps real-world PDFs at ~750 KB with an opaque 413.
    client_max_body_size 64m;

    # Lightweight healthcheck endpoint for the container HEALTHCHECK.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Reverse-proxy all backend traffic. ``proxy_read_timeout`` is bumped
    # because a single /api/chat call against gemma3:12b on CPU can take
    # ~120-180 s; the default 60 s would mask successful runs as 504s.
    location /api/ {
        proxy_pass         http://bdl_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA shell - serve the built Angular bundle.
    root /usr/share/nginx/html;
    index index.html;

    # Long-cache fingerprinted assets; leave index.html un-cached so a new
    # deployment is picked up on the next request.
    location ~* \.(?:css|js|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # Licence and attribution files, served from the webroot with an honest 404.
    # They do not match the static-asset regex above, so without this block they
    # would fall into the SPA fallback below and a MISSING notice would be
    # answered with HTTP 200 + index.html - a compliance check that only inspects
    # the status code would pass on a missing notice. The backend image hardens
    # the same paths explicitly (see server/app.py, _LEGAL_FILES), so both
    # deployments answer identically.
    location ~ ^/(3rdpartylicenses\.txt|LICENSE|THIRD-PARTY-NOTICES\.md)$ {
        default_type text/plain;
        try_files $uri =404;
    }

    # History-API fallback: unknown paths return the SPA shell.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
